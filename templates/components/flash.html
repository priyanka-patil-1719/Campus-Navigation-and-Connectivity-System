{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ icon('info' if category == 'error' else 'check') }}<span>{{ message }}</span><button type="button" aria-label="Dismiss notification" data-dismiss>×</button></div>
{% endfor %}{% endwith %}
